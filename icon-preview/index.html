<!DOCTYPE html>
<html dir="rtl"><head><meta charset="UTF-8">
<title>آیکون‌های نمونه</title>
<style>

.row { display: flex; gap: 20px; flex-wrap: wrap; }
.icon-box { 
  width: 80px; height: 80px; background: #fff; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid #cbd5e1; box-shadow: 0 2px 8px rgba(15,23,42,.06);
}
.icon-box svg { width: 44px; height: 44px; color: #16a34a; }
.label { text-align: center; font-size: 11px; color: #64748b; margin-top: 6px; }
</style></head><body>
