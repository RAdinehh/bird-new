name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Silent Catch Detector
        run: |
          COUNT=$(grep -rn "catch (e) {}" src/mod --include="*.ts*" | wc -l || echo 0)
          echo "Empty catches: $COUNT"
          if [ "$COUNT" -gt 5 ]; then
            echo "::warning::Too many empty catch blocks: $COUNT"
          fi
