<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="نرم‌افزار جامع مدیریت مرغداری — آفلاین، فارسی" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="مرغداری" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preload" as="font" type="font/woff2" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <script>
    (function(){
      try {
        var raw = localStorage.getItem('pm-settings');
        if (!raw) return;
        var p = JSON.parse(raw);
        var s = p && p.state ? p.state : p;
        if (!s) return;
        var root = document.documentElement;

        // ─── Theme ───
        if (s.theme) root.setAttribute('data-theme', s.theme);

        // ─── Accent color ───
        var ACCENT = {
          green:  { light: { a:'#16a34a', s:'rgba(22,163,74,.12)',  b:'rgba(22,163,74,.35)',  t:'#ffffff' },
                    dark:  { a:'#22c55e', s:'rgba(34,197,94,.15)',  b:'rgba(34,197,94,.4)',   t:'#0f172a' } },
          blue:   { light: { a:'#0284c7', s:'rgba(2,132,199,.12)',  b:'rgba(2,132,199,.35)',  t:'#ffffff' },
                    dark:  { a:'#38bdf8', s:'rgba(56,189,248,.15)', b:'rgba(56,189,248,.4)',  t:'#0f172a' } },
          orange: { light: { a:'#ea580c', s:'rgba(234,88,12,.12)',  b:'rgba(234,88,12,.35)',  t:'#ffffff' },
                    dark:  { a:'#fb923c', s:'rgba(251,146,60,.15)', b:'rgba(251,146,60,.4)',  t:'#0f172a' } },
          purple: { light: { a:'#7c3aed', s:'rgba(124,58,237,.12)', b:'rgba(124,58,237,.35)', t:'#ffffff' },
                    dark:  { a:'#a78bfa', s:'rgba(167,139,250,.15)',b:'rgba(167,139,250,.4)', t:'#0f172a' } }
        };
        var ac = ACCENT[s.accentColor] || ACCENT.green;
        var ap = s.theme === 'dark' ? ac.dark : ac.light;
        root.style.setProperty('--accent', ap.a);
        root.style.setProperty('--accent-soft', ap.s);
        root.style.setProperty('--accent-border', ap.b);
        root.style.setProperty('--avatar-text', ap.t);

        // ─── Font size ───
        var SCALES = { small: 0.9, medium: 1, large: 1.15, xlarge: 1.3 };
        var FB = { xs:11, sm:12.5, base:13, md:14, lg:15.5, xl:19, xxl:23 };
        var sc = SCALES[s.fontSize] || 1;
        root.style.setProperty('--fs-xs',   (FB.xs * sc) + 'px');
        root.style.setProperty('--fs-sm',   (FB.sm * sc) + 'px');
        root.style.setProperty('--fs-base', (FB.base * sc) + 'px');
        root.style.setProperty('--fs-md',   (FB.md * sc) + 'px');
        root.style.setProperty('--fs-lg',   (FB.lg * sc) + 'px');
        root.style.setProperty('--fs-xl',   (FB.xl * sc) + 'px');
        root.style.setProperty('--fs-2xl',  (FB.xxl * sc) + 'px');

        // ─── Animations / Low power ───
        var animOn = s.animations !== false && !s.lowPowerMode;
        if (animOn) {
          root.style.setProperty('--dur-fast', '150ms');
          root.style.setProperty('--dur-base', '200ms');
          root.style.setProperty('--dur-slow', '250ms');
          root.style.setProperty('--dur-enter', '300ms');
          root.style.setProperty('--dur-exit', '150ms');
        } else {
          root.classList.add('pm-no-anim');
          root.style.setProperty('--dur-fast', '0.01ms');
          root.style.setProperty('--dur-base', '0.01ms');
          root.style.setProperty('--dur-slow', '0.01ms');
          root.style.setProperty('--dur-enter', '0.01ms');
          root.style.setProperty('--dur-exit', '0.01ms');
        }

        // ─── Density ───
        if (s.density === 'compact') root.classList.add('pm-dense');
        else root.classList.add('pm-comfy');

        // ─── High contrast ───
        if (s.highContrast) root.classList.add('pm-high-contrast');
      } catch (e) {}
    })();
  </script>
  <title>مدیریت مرغداری</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
