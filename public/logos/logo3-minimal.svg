<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="g3gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#g3bg)"/>

  <!-- هلال ماه (نماد ایرانی/اسلامی) -->
  <path d="M 340 100 A 80 80 0 1 0 340 220 A 65 65 0 1 1 340 100 Z"
        fill="url(#g3gold)" opacity="0.85"/>

  <!-- تخم‌مرغ بزرگ -->
  <ellipse cx="256" cy="330" rx="120" ry="150" fill="#ffffff"/>
  <ellipse cx="256" cy="330" rx="120" ry="150" fill="none" stroke="#ecfdf5" stroke-width="6"/>

  <!-- مرغ ساده داخل تخم -->
  <g transform="translate(256 340)">
    <ellipse cx="0" cy="20" rx="45" ry="35" fill="#047857"/>
    <circle cx="0" cy="-15" r="22" fill="#047857"/>
    <path d="M -10 -30 Q -6 -42, 0 -30 Q 6 -42, 10 -30"
          stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 18 -15 L 30 -13 L 18 -10 Z" fill="#f59e0b"/>
    <circle cx="8" cy="-17" r="2.5" fill="#fff"/>
  </g>

  <!-- نقطه‌های تزئینی -->
  <circle cx="80" cy="80" r="6" fill="#fcd34d" opacity="0.6"/>
  <circle cx="432" cy="432" r="6" fill="#fcd34d" opacity="0.6"/>
  <circle cx="80" cy="432" r="4" fill="#ffffff" opacity="0.4"/>
  <circle cx="432" cy="80" r="4" fill="#ffffff" opacity="0.4"/>
</svg>