<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طرح‌های لوگو</title>
<style>
  body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #4ade80; margin-bottom: 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; max-width: 1100px; margin: 0 auto; }
  .card { background: #1e293b; border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .card h3 { color: #4ade80; margin: 0 0 14px; font-size: 16px; }
  .card svg, .card img { width: 100%; max-width: 240px; height: auto; border-radius: 24px; }
  .card p { color: #94a3b8; font-size: 13px; margin: 12px 0 0; }
</style>
</head>
<body>
<h1>🎨 طرح‌های لوگو — «مزرعه طیور ایران»</h1>
<div class="grid">
  <div class="card"><h3>طرح ۱ — کلاسیک</h3><img src="logo1-chicken-sun.svg"><p>مرغ + تخم‌مرغ + خورشید ایرانی</p></div>
  <div class="card"><h3>طرح ۲ — مدرن انتزاعی</h3><img src="logo2-abstract.svg"><p>پرنده انتزاعی + چرخه + گندم</p></div>
  <div class="card"><h3>طرح ۳ — مینیمال</h3><img src="logo3-minimal.svg"><p>هلال + تخم‌مرغ + مرغ ساده</p></div>
  <div class="card"><h3>طرح ۴ — افقی</h3><img src="logo4-horizontal.svg"><p>برای Splash/About</p></div>
</div>
</body>
</html>
