<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#g2bg)"/>

  <!-- دایره چرخه -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3"/>

  <!-- پرنده انتزاعی (شکل S) -->
