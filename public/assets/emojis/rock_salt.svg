<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rs_main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="rs_pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE4E6"/>
      <stop offset="100%" stop-color="#FDA4AF"/>
    </linearGradient>
  </defs>
  <!-- قطعه بزرگ سنگ نمک بلوری -->
  <polygon points="30,10 48,18 52,38 38,52 16,48 12,28" fill="url(#rs_main)" stroke="#475569" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- وجه بلوری صورتی/معدنی -->
  <polygon points="30,10 48,18 35,31 19,24" fill="url(#rs_pink)" opacity="0.75"/>
  <polyline points="19,24 35,31 38,52" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="35" y1="31" x2="52" y2="38" stroke="#64748B" stroke-width="1.6"/>
  <!-- بلورهای کوچک کنار سنگ نمک -->
  <polygon points="10,46 18,43 22,52 12,55" fill="#F8FAFC" stroke="#475569" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="44,46 53,43 56,51 47,54" fill="#FFE4E6" stroke="#475569" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
