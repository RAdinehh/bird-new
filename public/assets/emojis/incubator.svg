<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="chamber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <radialGradient id="heat_lamp" cx="50%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F97316" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- بدنه اصلی کابین انکوباتور -->
  <rect x="8" y="4" width="48" height="54" rx="7" fill="url(#cab)" stroke="#334155" stroke-width="2.2"/>
  <!-- پایه‌های دستگاه -->
  <rect x="13" y="58" width="7" height="4" rx="1.5" fill="#334155"/>
  <rect x="44" y="58" width="7" height="4" rx="1.5" fill="#334155"/>
  <!-- پنل کنترل دیجیتال بالای دستگاه -->
  <rect x="12" y="8" width="40" height="9" rx="2.5" fill="#0F172A"/>
  <rect x="15" y="10" width="15" height="5" rx="1" fill="#064E3B"/>
  <text x="22.5" y="14" text-anchor="middle" font-family="monospace" font-size="4.8" font-weight="bold" fill="#34D399">37.7°</text>
  <circle cx="36" cy="12.5" r="2" fill="#EF4444"/>
  <circle cx="42" cy="12.5" r="2" fill="#38BDF8"/>
  <circle cx="48" cy="12.5" r="2" fill="#FACC15"/>
  <!-- پنجره شیشه‌ای درب دستگاه -->
  <rect x="12" y="20" width="35" height="34" rx="3.5" fill="url(#chamber)" stroke="#475569" stroke-width="2"/>
  <rect x="13" y="21" width="33" height="32" rx="2.5" fill="url(#heat_lamp)"/>
  <!-- دستگیره درب شیشه‌ای -->
  <rect x="49.5" y="31" width="3.5" height="12" rx="1.5" fill="#334155"/>
  <!-- سبدهای چرخان تخم داخل دستگاه -->
  <line x1="14" y1="32" x2="45" y2="32" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="14" y1="44" x2="45" y2="44" stroke="#E2E8F0" stroke-width="2"/>
  <!-- تخم‌های ردیف بالا -->
  <ellipse cx="19.5" cy="27.5" rx="3" ry="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <ellipse cx="29.5" cy="27.5" rx="3" ry="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <ellipse cx="39.5" cy="27.5" rx="3" ry="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <!-- تخم‌های ردیف پایین -->
  <ellipse cx="19.5" cy="39.5" rx="3" ry="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <ellipse cx="29.5" cy="39.5" rx="3" ry="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <ellipse cx="39.5" cy="39.5" rx="3" ry="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <!-- بازتاب شیشه -->
  <path d="M15 23L22 51" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2.5" stroke-linecap="round"/>
</svg>
