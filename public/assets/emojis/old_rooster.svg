<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rooster_neck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D6D3D1"/>
      <stop offset="55%" stop-color="#A8A29E"/>
      <stop offset="100%" stop-color="#78716C"/>
    </linearGradient>
    <linearGradient id="droop_comb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DC6B6B"/>
      <stop offset="100%" stop-color="#A94442"/>
    </linearGradient>
  </defs>
  <!-- گردن و پرهای یال خروس (نیم‌رخ واضح) -->
  <path d="M12 58 L16 33 C17 22 25 16 35 17 C43 18 47 24 47 32 C47 38 44 43 39 46 L42 58 L35 53 L30 58 L25 53 L19 58 Z" fill="url(#rooster_neck)" stroke="#44403C" stroke-width="2" stroke-linejoin="round"/>
  <!-- خطوط پرهای گردن خروس -->
  <path d="M21 38 L17 50 M27 40 L25 51 M33 42 L33 52" stroke="#57534E" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <!-- تاج افتاده و خمیده به جلو/پهلو (نشانه پیری و افت سرحالی) -->
  <path d="M18 22 C16 14 22 10 28 13 C32 9 39 10 42 15 C46 16 49 21 44 25 C40 27 35 23 31 23 C26 23 22 26 18 22 Z" fill="url(#droop_comb)" stroke="#7F1D1D" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- غبغب آویزان زیر نوک -->
  <path d="M44 37 C49 39 49 47 44 49 C40 50 38 45 40 39 Z" fill="#B94A48" stroke="#7F1D1D" stroke-width="1.5"/>
  <!-- نوک خمیده خروس -->
  <path d="M46 28 C52 29 56 32 58 35 C54 36 49 36 45 35 Z" fill="#EAB308" stroke="#854D0E" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M45 35 L54 36 L45 38 Z" fill="#CA8A04" stroke="#854D0E" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- چشم نیمه‌بسته و بی‌حال -->
  <circle cx="37" cy="29" r="4" fill="#FEF3C7" stroke="#44403C" stroke-width="1.4"/>
  <circle cx="38" cy="30" r="1.7" fill="#1C1917"/>
  <!-- پلک افتاده روی نیمه بالای چشم -->
  <path d="M32.5 28.5 C34.5 26 39.5 26 41.5 28.5 L41.5 29.5 C38.5 29 35.5 29 32.5 29.5 Z" fill="#A8A29E" stroke="#44403C" stroke-width="1.2"/>
</svg>
