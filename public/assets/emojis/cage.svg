    <line x1="92" y1="22" x2="92" y2="102" stroke="#64748B" stroke-width="3"/>
    <!-- ناودانی جلوی قفس -->
    <rect x="14" y="57" width="100" height="8" rx="3" fill="#F59E0B" stroke="#78350F" stroke-width="2.5"/>
    <rect x="14" y="96" width="100" height="8" rx="3" fill="#F59E0B" stroke="#78350F" stroke-width="2.5"/>
